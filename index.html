<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频预览图</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body theme="LIGHT">
  <!-- booting：脚本解析时同步预填充真实设置后才移除，避免首帧闪出静态默认值 -->
  <div class="wrap booting" id="wrap">
    <div class="toolbar">
      <label class="count">数量
        <input id="tileCount" type="number" min="0" max="30" step="1" title="0 = 此视频不生成预览图">
      </label>
      <button id="generate" class="btn primary" type="button" hidden>生成</button>
      <button id="clear" class="btn danger" type="button" hidden>清空</button>
      <span class="spacer"></span>
      <label class="switch" title="启用后，选择视频时自动生成预览图">
        <input id="autoGenerate" type="checkbox">
        <span class="track"></span>
        <span class="switch-label">自动生成</span>
      </label>
    </div>

    <div id="status" class="status hint"></div>
    <div id="grid" class="grid"></div>

    <div id="footer" class="footer" hidden>
      <button id="toggle" class="btn link" type="button"></button>
    </div>
  </div>

  <!-- eagle.dialog 在检查器环境不可用时的兜底确认框（纯 DOM，不依赖宿主 API） -->
  <div id="confirm" class="modal" hidden>
    <div class="modal-box">
      <div id="confirmTitle" class="modal-title">批量修改确认</div>
      <div id="confirmMessage" class="modal-message"></div>
      <div id="confirmDetail" class="modal-detail"></div>
      <div class="modal-actions">
        <button id="confirmCancel" class="btn" type="button">取消</button>
        <button id="confirmOk" class="btn primary" type="button">确认</button>
      </div>
    </div>
  </div>

  <script src="js/sampler.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/batch.js"></script>
  <script src="js/store.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
