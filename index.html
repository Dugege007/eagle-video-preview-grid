<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Video Preview Grid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body theme="LIGHT">
  <div class="wrap" id="wrap">
    <div class="toolbar">
      <span class="title">预览图</span>
      <label class="switch" title="启用后，选择视频时自动生成预览图">
        <input id="autoGenerate" type="checkbox">
        <span class="track"></span>
        <span class="switch-label">自动生成</span>
      </label>
    </div>

    <div class="toolbar secondary">
      <label class="count">数量
        <input id="tileCount" type="number" min="1" max="30" step="1" value="9">
      </label>
      <span class="spacer"></span>
      <button id="generate" class="btn primary" type="button">生成</button>
      <button id="clear" class="btn" type="button">清空</button>
    </div>

    <div id="status" class="status hint"></div>
    <div id="grid" class="grid"></div>

    <div id="footer" class="footer" hidden>
      <button id="toggle" class="btn link" type="button"></button>
    </div>
  </div>

  <script src="js/sampler.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/store.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
