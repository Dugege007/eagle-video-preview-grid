<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Video Preview Grid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body theme="LIGHT">
  <div class="wrap">
    <div class="toolbar">
      <span class="title">预览图</span>
      <label class="count">数量
        <input id="tileCount" type="number" min="1" max="30" step="1" value="9">
      </label>
      <button id="generate" class="btn primary" type="button">生成</button>
    </div>

    <div id="status" class="status hint"></div>
    <div id="grid" class="grid"></div>

    <div class="footer">
      <span id="counter" class="counter"></span>
      <button id="toggle" class="btn link" type="button" hidden></button>
    </div>
  </div>

  <script src="js/sampler.js"></script>
  <script src="js/store.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
